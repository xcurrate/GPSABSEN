name: Supabase Keep-Alive

# Supabase Free Plan menjeda proyek yang tidak ada aktivitas database selama 7 hari.
# Workflow ini mengirim beberapa request ringan ke REST API tiap hari agar proyek
# dianggap aktif dan tidak dijeda. Tidak mengubah data apa pun.
#
# Nilai bisa diambil dari Secrets ATAU Variables (keduanya didukung).
# Secret diprioritaskan; jika kosong, dipakai variable dengan nama yang sama.

on:
  schedule:
    # 4x sehari (UTC). Indonesia (WIB = UTC+7), jadi ini sekitar 08:00, 14:00, 20:00, 02:00 WIB.
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # secrets.* lebih diprioritaskan; fallback ke vars.* bila secret tidak ada.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
    steps:
      - name: Validasi & ping database
        run: |
          # Bersihkan spasi/newline dan tanda kutip yang mungkin ikut ter-paste.
          clean() { printf '%s' "$1" | tr -d '[:space:]' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"; }
          url=$(clean "${SUPABASE_URL:-}")
          key=$(clean "${SUPABASE_ANON_KEY:-}")
          key=${key#Bearer }
          key=${key#bearer }
          key=${key#Bearer}
          key=${key#bearer}

          if [ -z "$url" ]; then echo "::error::SUPABASE_URL belum diset (Secrets atau Variables)."; exit 1; fi
          if [ -z "$key" ]; then echo "::error::SUPABASE_ANON_KEY belum diset (Secrets atau Variables)."; exit 1; fi

          case "$url" in
            http://*|https://*) ;;
            *) url="https://$url" ;;
          esac
          url="${url%/}"

          if ! printf '%s' "$url" | grep -qE '^https?://[A-Za-z0-9.-]+(:[0-9]+)?$'; then
            echo "::error::SUPABASE_URL tidak valid: '$url' (contoh benar: https://abcdefgh.supabase.co)"
            exit 1
          fi
          echo "Menghubungi: $url"

          # Diagnostik kunci (tanpa membocorkan isi): panjang + awalan.
          prefix=$(printf '%s' "$key" | cut -c1-14)
          echo "Panjang SUPABASE_ANON_KEY: ${#key} karakter (awalan: ${prefix}...)"
          if printf '%s' "$key" | grep -qE '^eyJ'; then
            echo "Format kunci: JWT (anon/service_role legacy)."
          elif printf '%s' "$key" | grep -qE '^sb_publishable_'; then
            echo "Format kunci: publishable key (baru)."
          else
            echo "::warning::Format SUPABASE_ANON_KEY tidak dikenali. Seharusnya diawali 'eyJ' (JWT) atau 'sb_publishable_'."
          fi

          endpoint="$url/rest/v1/settings?select=key&limit=1"
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' --max-time 20 \
              "$endpoint" -H "apikey: $key" -H "Authorization: Bearer $key") || code=000
            echo "Percobaan $attempt -> HTTP $code"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "OK: proyek Supabase aktif."
              exit 0
            fi
            if [ "$code" = "401" ]; then
              echo "::error::HTTP 401 = SUPABASE_ANON_KEY salah/tidak cocok dengan proyek. Salin ulang 'anon public' key dari Project Settings > API (pastikan tidak tertukar dengan service_role atau proyek lain)."
              cat /tmp/resp.txt || true
              exit 1
            fi
            sleep 5
          done
          echo "::error::Gagal menghubungi Supabase (HTTP $code). Cek SUPABASE_URL/SUPABASE_ANON_KEY, atau proyek mungkin sedang dijeda."
          cat /tmp/resp.txt || true
          exit 1
